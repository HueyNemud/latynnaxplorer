pre-commit:
  commands:
    # tous les fichiers indexés, sans glob : Biome écarte lui-même ce qu'il ne
    # traite pas (biome.json), comme `pnpm lint` et la CI
    lint:
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    # tsc ne vérifie pas un fichier isolé avec la configuration du projet :
    # tout le projet est vérifié dès qu'un fichier TypeScript (ou TSX) est indexé.
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
