# Vérifications automatiques de chaque PR et de chaque arrivée sur main.
# Le nom du job (« verification ») est celui exigé par la protection de main :
# le renommer demande de mettre la règle à jour.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur une PR annule la vérification en cours de la même PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    name: verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serveur PostgreSQL des tests : ils créent eux-mêmes leur base <base>_test
    # (scripts/test-database.ts) ; même image que compose.yaml.
    services:
      db:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: latynna
          POSTGRES_PASSWORD: latynna
          POSTGRES_DB: latynnaxplorer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U latynna -d latynnaxplorer"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://latynna:latynna@localhost:5432/latynnaxplorer
    steps:
      - uses: actions/checkout@v7

      # pnpm (version de « packageManager »), Node et `pnpm install` en une
      # étape ; échoue si pnpm-lock.yaml n'est pas à jour.
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
